<!DOCTYPE html>
<html>
<head>
    <title>EduGenie - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>EduGenie</h1>

        <p>AI Learning Assistant</p>

        <h2>Login</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

    </div>

</div>

</body>
</html>
